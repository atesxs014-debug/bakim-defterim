<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E1114">
<script src="vendor/capacitor.js"></script>
<title>Bakım Defterim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first app shell — sticky header, 2×2 vehicle grid that fills one screen, bottom sheets for forms */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface2:#F5F7F9; --fg:#14181D; --muted:#5D6672; --line:#D6DBE1;
  --accent:#E08408; --accent-ink:#B4690A; --on-accent:#1A1203;
  --ok:#1F8A4C; --warn:#C77700; --bad:#C83A2E;
  --plate-blue:#1C47A8;
  --shadow:0 1px 2px rgba(20,24,29,.06),0 6px 18px rgba(20,24,29,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1114; --surface:#171B20; --surface2:#1E232A; --fg:#ECEFF2; --muted:#8B95A1; --line:#272D35;
  --accent:#FFB23F; --accent-ink:#FFB23F; --on-accent:#1A1203;
  --ok:#3CC47A; --warn:#FFB23F; --bad:#FF6B5E; --plate-blue:#2556C4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1114; --surface:#171B20; --surface2:#1E232A; --fg:#ECEFF2; --muted:#8B95A1; --line:#272D35;
  --accent:#FFB23F; --accent-ink:#FFB23F; --on-accent:#1A1203;
  --ok:#3CC47A; --warn:#FFB23F; --bad:#FF6B5E; --plate-blue:#2556C4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3); color-scheme:dark}

html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{position:fixed;inset:0;width:100%;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.scroll{flex:1;min-height:0;width:100%;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.wrap{width:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* Buttons */
.btn{appearance:none;border:0;border-radius:12px;padding:14px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn-primary{background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.btn-danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn-danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.icon-btn svg{width:20px;height:20px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-height:50px;width:100%}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
.field select:disabled{opacity:.5}
.field textarea{min-height:80px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600}
.seg svg{width:34px;height:18px;color:var(--muted)}
.seg input:checked+span{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg input:checked+span svg{color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);font-size:13px;min-height:18px}

/* Turkish plate */
.plate{display:inline-flex;align-items:stretch;background:#fff;color:#111;border:2px solid #111;border-radius:6px;overflow:hidden;font-family:var(--f-display);font-weight:700;letter-spacing:.06em;line-height:1}
.plate .tr{background:var(--plate-blue);color:#fff;font-size:.5em;display:flex;align-items:flex-end;justify-content:center;padding:0 .35em .25em;letter-spacing:0}
.plate .pn{padding:.18em .45em .12em;white-space:nowrap}
.plate.lg{font-size:30px}
.plate.md{font-size:20px}
.plate.sm{font-size:15px;border-width:1.5px;border-radius:4px}

/* Onboarding */
#onb .scroll>.wrap{padding-block:28px 40px}
.onb-head{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.onb-head h1{font-size:40px;line-height:1}
.onb-head p{margin:0;color:var(--muted);max-width:34ch}
.gauge{width:64px;height:64px}
.plate-preview{display:flex;justify-content:center;padding:18px 0 6px}
.form{display:flex;flex-direction:column;gap:14px}
.form .btn-primary{margin-top:8px;width:100%}

/* Welcome */
#welcome{display:grid;place-items:center;text-align:center}
#welcome .glow-bg{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 55%);opacity:0;animation:bgIn 1.6s .2s ease forwards;pointer-events:none}
.w-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.w-hello{font-family:var(--f-display);font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);opacity:0;animation:fadeUp .6s .1s ease forwards}
.w-name{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,13vw,76px);line-height:.95;text-transform:uppercase;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .25em;max-width:100%}
.w-name .word{display:inline-flex}
.w-name span.ch{display:inline-block;color:var(--line);animation:lightUp .5s ease forwards}
.w-plate{opacity:0;animation:pop .6s cubic-bezier(.2,1.6,.4,1) forwards}
.w-sub{color:var(--muted);opacity:0;animation:fadeUp .6s ease forwards}
.w-btn{opacity:0;animation:fadeUp .6s ease forwards;min-width:200px}
.sweep{position:relative;width:min(280px,70vw);height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.sweep::after{content:"";position:absolute;inset:0;width:40%;background:var(--accent);border-radius:3px;animation:sweep 1.4s ease-in-out infinite}
@keyframes lightUp{0%{color:var(--line);text-shadow:none}55%{color:#fff;text-shadow:0 0 18px var(--accent),0 0 42px var(--accent)}100%{color:var(--accent);text-shadow:0 0 14px color-mix(in srgb,var(--accent) 55%,transparent)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes bgIn{to{opacity:1}}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* App header */
.topbar{flex:none;background:var(--bg)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:14px 12px}
.topbar .grow{flex:1;min-width:0}
.topbar h1{font-size:30px;line-height:1}
.topbar .who{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Vehicle grid — 4 per screen */
.grid-wrap{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scroll-snap-type:y mandatory;padding-block:4px 14px}
.grid{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;grid-auto-rows:calc(50% - 6px)}
.vcard{scroll-snap-align:start}
.vcard{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;padding:0;box-shadow:var(--shadow);min-width:0}
.vcard .ph{flex:1;min-height:0;background:var(--surface2);position:relative;display:grid;place-items:center;overflow:hidden}
.vcard .ph img{width:100%;height:100%;object-fit:cover;max-width:100%}
.vcard .ph svg.car{width:70%;color:var(--muted);opacity:.55}
.vcard .ph .pill{position:absolute;left:8px;top:8px}
.vcard .meta{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.vcard .bm{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard .yr{font-size:12px;color:var(--muted)}
.vcard.add{border-style:dashed;box-shadow:none;background:transparent;align-items:center;justify-content:center;gap:10px;color:var(--muted)}
.vcard.add .plus{width:52px;height:52px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:28px;color:var(--accent-ink)}
.vcard.add span{font-family:var(--f-display);font-size:18px;font-weight:600}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--ok)} .pill.warn i{background:var(--warn)} .pill.bad i{background:var(--bad)}

/* Detail */
#dBody{padding-bottom:110px}
.hero{position:relative;border-radius:18px;overflow:hidden;background:var(--surface2);aspect-ratio:16/10;max-width:100%;border:1px solid var(--line);display:grid;place-items:center}
.hero img{width:100%;height:100%;object-fit:cover}
.hero svg.car{width:55%;color:var(--muted);opacity:.5}
.hero .photo-btn{position:absolute;right:10px;bottom:10px;background:rgba(10,12,15,.72);color:#fff;border:0;border-radius:10px;padding:9px 12px;font-weight:600;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
.hero .photo-btn svg{width:16px;height:16px}
.d-title{display:flex;flex-direction:column;gap:10px;margin:16px 0 18px}
.d-title h2{font-size:34px;line-height:1}
.d-title .sub{color:var(--muted)}
.section{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-h h3{font-size:22px}
.link-btn{appearance:none;border:0;background:none;color:var(--accent-ink);font-weight:600;cursor:pointer;padding:6px 0}

.next{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.next.warn{border-color:var(--warn)} .next.bad{border-color:var(--bad)}
.next .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.meter .top b{color:var(--fg);font-weight:600}
.bar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok);border-radius:8px}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}

.specs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.spec{padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line);min-width:0}
.spec:nth-child(odd){border-right:1px solid var(--line)}
.spec:nth-last-child(-n+2){border-bottom:0}
.spec .v{font-weight:600;font-size:16px;overflow-wrap:anywhere}

.hint{font-size:12.5px;color:var(--muted)}
.specbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;color:var(--fg)}
.specbox.loading{flex-direction:row;align-items:center;gap:14px}
.spin{width:28px;height:28px;flex:none;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.timeline{display:flex;flex-direction:column;gap:10px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.rec .rh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rec .date{font-family:var(--f-display);font-weight:700;font-size:20px}
.rec .km{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:4px 9px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
.rec .foot{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap;align-items:center}
.rec .note{font-size:14px;color:var(--fg);margin:0}
.rec .del{appearance:none;border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 0}
.rec .del.armed{color:var(--bad);font-weight:600}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent);width:min(calc(100% - 32px),528px)}

/* Bottom sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,7,9,.5);z-index:20;opacity:0;transition:opacity .2s}
.sheet-bg.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:92dvh;overflow:auto;transform:translateY(100%);transition:transform .25s ease;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.show{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:10px auto 4px}
.sheet .wrap{padding-block:8px 8px;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:26px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;cursor:pointer;min-width:0}
.check input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.check:has(input:checked){border-color:var(--accent)}
.sheet-actions{display:flex;gap:10px}
.sheet-actions .btn{flex:1}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:40;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition:none!important}
  .w-name span.ch{color:var(--accent)}
}
@media (max-width:360px){.checks{grid-template-columns:1fr}}
/* Detail tabs */
.tabs{flex:none;display:flex;gap:6px;width:100%;max-width:560px;margin:0 auto;padding-block:0 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
.tabs::-webkit-scrollbar{display:none}
.tabs button{appearance:none;flex:1 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.section.first{margin-top:4px}
.kmchip{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;border:0;border-radius:99px;padding:6px 10px;background:rgba(10,12,15,.74);color:#fff;font-size:12px;font-weight:600;cursor:pointer}
.kmchip svg{width:12px;height:12px}
.kmrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.kmrow b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1}
.kmrow small{color:var(--muted);font-size:12px}
.kmrow .btn{min-height:42px;padding:10px 14px;flex:none}
.dlist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow>span:first-child{display:flex;flex-direction:column;font-weight:600;min-width:0}
.drow small{font-weight:400;color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.part{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0;color:var(--fg)}
.part .pt{display:flex;flex-direction:column;gap:2px}
.part .pt span{font-size:12.5px;color:var(--muted)}
.part .pt span.warn{color:var(--warn)} .part .pt span.bad{color:var(--bad)}
.part:last-child:nth-child(odd){grid-column:1/-1}
.part small{font-size:11.5px;color:var(--muted);line-height:1.3}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat b small{font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:500;margin-left:3px}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.total b{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.mchart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;height:170px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 8px 10px}
.mcol{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;height:100%}
.mtrack{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),var(--line) calc(25% - 1px),var(--line) 25%)}
.mbar{width:100%;max-width:20px;background:var(--accent);border-radius:4px 4px 1px 1px}
.mbar.top{background:var(--accent-ink)}
.mcol span{font-size:10px;color:var(--muted)}
.cats{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.cat .ct{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.cat .ct b{font-variant-numeric:tabular-nums}
.cat .bar{margin-top:6px}
.cat .bar i{background:var(--accent)}
.chipsel{display:flex;gap:6px;flex-wrap:wrap}
.chipsel button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;cursor:pointer;color:var(--fg)}
.chipsel button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent)}
.badge{font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}

function resizeImage(src,max,q){
  return new Promise(res=>{const img=new Image();
    img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};
    img.onerror=()=>{toast("Bu dosya açılamadı. JPG veya PNG bir fotoğraf seç.");res(null)};img.src=src});
}
async function pickImage(opts={}){

    try{const p=await CAM.getPhoto({quality:88,resultType:"dataUrl",source:opts.camera?"CAMERA":"PROMPT",correctOrientation:true,width:2000,
      promptLabelHeader:"Fotoğraf",promptLabelPhoto:"Galeriden seç",promptLabelPicture:"Fotoğraf çek",promptLabelCancel:"Vazgeç"});data=p.dataUrl}
    catch(e){const m=String((e&&e.message)||e).toLowerCase();if(!m.includes("cancel"))toast("Fotoğraf alınamadı. Kamera ve galeri iznini kontrol et.");return null}
  }else{

}

/* Files out: share sheet on the phone, download in a browser */
function u8b64(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
async function shareFile(name,b64,mime,title){
  const FS=plug("Filesystem"),SH=plug("Share");
  if(FS&&SH){
    const w=await FS.writeFile({path:name,data:b64,directory:"CACHE"});
    try{await SH.share({title,files:[w.uri],dialogTitle:title})}catch(e){if(!String((e&&e.message)||e).toLowerCase().includes("cancel"))throw e}
    return;
  }
  const bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u8],{type:mime}));const a=document.createElement("a");a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function showBusy(text){

  d.innerHTML=`<div><div class="spin"></div><div>${esc(text)}</div></div>`;document.body.appendChild(d);

}

/* ===== Reminders (local notifications) ===== */
const DATE_LABELS={muayene:"Muayene",sigorta:"Trafik sigortası",kasko:"Kasko",mtv:"MTV ödemesi"};
function nid(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2000000000+1}
function at10(dateStr,off){const d=new Date(dateStr+"T10:00:00");d.setDate(d.getDate()+off);return d}
async function ensureNotifPerm(){
  const LN=plug("LocalNotifications");if(!LN)return false;
  try{let p=await LN.checkPermissions();if(p.display!=="granted")p=await LN.requestPermissions();return p.display==="granted"}catch(e){return false}
}
async function scheduleAll(){
  const LN=plug("LocalNotifications");if(!LN)return;
  try{
    const pend=await LN.getPending();
    if(pend&&pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    if(!S.vehicles.length||(!S.settings.notif&&!S.settings.kmMonthly))return;
    if(!(await ensureNotifPerm()))return;
    const now=Date.now()+60000,list=[];
    const add=(key,title,body,date)=>{if(date&&date.getTime()>now)list.push({id:nid(key),title,body,schedule:{at:date,allowWhileIdle:true}})};
    if(S.settings.notif)S.vehicles.forEach(v=>{
      const name=`${v.plate} · ${v.brand} ${v.model}`,st=status(v);
      if(!st.none){
        const due=ymd(st.dueDate);
        add(v.id+"b30","Bakım yaklaşıyor",`${name}: periyodik bakıma 30 gün kaldı.`,at10(due,-30));
        add(v.id+"b0","Bakım zamanı geldi",`${name}: periyodik bakım günü bugün.`,at10(due,0));
        if(st.kmLeft>0&&st.kmLeft<=1000){const t=new Date();t.setDate(t.getDate()+1);t.setHours(10,0,0,0);add(v.id+"bkm","Bakıma az kaldı",`${name}: bakıma ${fmtKm(st.kmLeft)} kaldı.`,t)}
      }
      Object.entries(v.dates||{}).forEach(([k,d])=>{if(!d||!DATE_LABELS[k])return;const L=DATE_LABELS[k];
        add(v.id+k+"15",`${L} yaklaşıyor`,`${name}: ${L.toLowerCase()} için 15 gün kaldı (${fmtDate(d)}).`,at10(d,-15));
        add(v.id+k+"1",`${L} yarın`,`${name}: ${L.toLowerCase()} için son gün yarın.`,at10(d,-1))});
    });
    list.sort((a,b)=>a.schedule.at-b.schedule.at);
    const out=list.slice(0,58);
    if(S.settings.kmMonthly)out.push({id:nid("kmMonthly"),title:"Kilometreni güncelle",body:"Bakım hatırlatmalarının doğru çalışması için araçlarının güncel km'sini gir.",schedule:{on:{day:1,hour:11,minute:0},allowWhileIdle:true}});
    if(out.length)await LN.schedule({notifications:out});
  }catch(e){console.warn("notif",e)}
}

/* ===== Reading numbers from photos (on-device OCR) ===== */
let _tess=null;
function loadTesseract(){
  if(window.Tesseract)return Promise.resolve(window.Tesseract);
  if(_tess)return _tess;
  _tess=new Promise((res,rej)=>{const s=document.createElement("script");s.src="vendor/tesseract.min.js";
    s.onload=()=>window.Tesseract?res(window.Tesseract):rej(new Error("x"));s.onerror=()=>{_tess=null;rej(new Error("load"))};document.head.appendChild(s)});
  return _tess;
}
function preprocess(src){
  return new Promise(res=>{const img=new Image();img.onload=()=>{
    const sc=Math.min(2,1800/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),p=d.data;
    let mn=255,mx=0;for(let i=0;i<p.length;i+=4){const g=.299*p[i]+.587*p[i+1]+.114*p[i+2];p[i]=g;if(g<mn)mn=g;if(g>mx)mx=g}
    const k=255/Math.max(1,mx-mn);for(let i=0;i<p.length;i+=4){const g=(p[i]-mn)*k;p[i]=p[i+1]=p[i+2]=g}
    x.putImageData(d,0,0);res(c.toDataURL("image/png"))};img.onerror=()=>res(src);img.src=src});
}
async function ocrImage(whitelist){
  const img=await pickImage({camera:true,max:1800,q:.92});if(!img)return null;
  const done=showBusy("Fotoğraf okunuyor… İlk kullanımda okuma modülü indirilir, internet gerekir.");
  let w=null;
  try{
    const T=await loadTesseract();w=await T.createWorker("eng");
    await w.setParameters({tessedit_char_whitelist:whitelist,tessedit_pageseg_mode:"11"});
    const pre=await preprocess(img);const r=await w.recognize(pre);return (r&&r.data&&r.data.text)||"";
  }catch(e){toast(navigator.onLine===false?"Okuma için internet bağlantısı gerekli.":"Fotoğraf okunamadı. Daha yakından ve net çekip tekrar dene.");return null}
  finally{try{w&&await w.terminate()}catch(e){}done()}
}
async function ocrKm(v){
  const t=await ocrImage("0123456789");if(t==null)return null;
  const nums=(t.match(/\d{3,7}/g)||[]).map(Number);
  if(!nums.length){toast("Kilometre okunamadı. Göstergeye yakından ve parlamasız çek.");return null}
  const cur=curKmOf(v),ok=nums.filter(n=>!cur||n>=cur*0.9);
  return (ok.length?ok:nums).sort((a,b)=>String(b).length-String(a).length||b-a)[0];
}
async function ocrPlate(){
  const t=await ocrImage("ABCDEFGHIJKLMNOPRSTUVYZ0123456789 ");if(t==null)return null;
  const up=t.toUpperCase().replace(/[^A-Z0-9\n ]/g," ");
  const rx=/(0[1-9]|[1-7]\d|8[01])\s?([A-Z]{1,3})\s?(\d{2,5})/;
  for(const line of up.split("\n")){const m=line.replace(/\s+/g," ").match(rx)||line.replace(/\s/g,"").match(rx);if(m)return `${m[1]} ${m[2]} ${m[3]}`}
  toast("Plaka okunamadı. Plakaya düz ve yakından çekip tekrar dene.");return null;
}

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2600)}

function show(id){["onb","welcome","home","detail"].forEach(s=>$("#"+s).hidden=s!==id);document.querySelectorAll(".scroll,.grid-wrap").forEach(e=>e.scrollTop=0)}
function plateHTML(p,size){return `<div class="plate ${size}"><span class="tr">TR</span><span class="pn">${esc(p||"—")}</span></div>`}
function carSvg(v){return `<svg class="car" viewBox="0 0 120 60" aria-hidden="true"><use href="#i-${v&&v.type==="moto"?"moto":"car"}"/></svg>`}
function normPlate(v){
  const s=v.toUpperCase().replace(/[^0-9A-ZÇĞİÖŞÜ]/g,"");
  const m=s.match(/^(\d{1,2})([A-ZÇĞİÖŞÜ]{1,3})?(\d{0,5})?/);
  if(!m)return s;
  return [m[1],m[2],m[3]].filter(Boolean).join(" ");
}

/* --- Status --- */
function status(v){
  const recs=(v.records||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!recs.length)return {cls:"",text:"Kayıt yok",none:true};
  const last=recs[0], interval=Number(v.interval)||(v.type==="moto"?5000:10000);
  const curKm=curKmOf(v);
  const dueKm=(Number(last.km)||0)+interval;
  const dueDate=new Date(last.date+"T12:00:00");dueDate.setFullYear(dueDate.getFullYear()+1);
  const daysLeft=Math.round((dueDate-new Date())/864e5);
  const kmLeft=dueKm-curKm;
  const kmPct=Math.min(100,Math.max(0,((curKm-(Number(last.km)||0))/interval)*100));
  const dayPct=Math.min(100,Math.max(0,(365-daysLeft)/365*100));
  let cls="ok",text="Güncel";
  if(kmLeft<=0||daysLeft<=0){cls="bad";text="Bakım geçti"}
  else if(kmLeft<=1500||daysLeft<=30){cls="warn";text="Bakım yaklaştı"}
  return {cls,text,last,curKm,dueKm,dueDate,daysLeft,kmLeft,kmPct,dayPct,interval};
}

function partDefs(v){
  const moto=v.type==="moto",o=v.partLife||{};
  const d=moto?[["lastik","Lastikler","Lastik değişimi",15000,4],["aku","Akü","Akü",null,3],["balata","Fren balatası","Fren balatası",15000,null],
      v.timing==="Kayış"?["kayis","CVT kayışı","CVT kayışı",Number(v.timingKm)||20000,null]:["zincir","Zincir-dişli seti","Zincir-dişli seti",Number(v.timingKm)||20000,null],
      ["buji","Buji","Buji",10000,2],["hidrolik","Fren hidroliği","Fren hidroliği",null,2]]
    :[["lastik","Lastikler","Lastik değişimi",40000,4],["aku","Akü","Akü",null,4],["balata","Fren balatası","Fren balatası",30000,null],
      ["hava","Hava filtresi","Hava filtresi",15000,1],["antifriz","Antifriz","Antifriz",null,2],["hidrolik","Fren hidroliği","Fren hidroliği",null,2]];
  if(!moto&&v.timing!=="Zincir"&&v.fuel!=="Elektrik")d.splice(3,0,["triger","Triger seti","Triger seti",Number(v.timingKm)||90000,5]);
  return d.map(([key,name,item,km,yr])=>({key,name,item,km:o[key]&&o[key].km!==undefined?o[key].km:km,yr:o[key]&&o[key].yr!==undefined?o[key].yr:yr}));

function partState(v,p){
  const last=(v.records||[]).filter(r=>(r.items||[]).includes(p.item)).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!last)return {none:true};
  const usedKm=Math.max(0,curKmOf(v)-(Number(last.km)||0)),days=Math.max(0,-daysTo(last.date));
  const pct=Math.max(p.km?usedKm/p.km:0,p.yr?days/(p.yr*365):0);
  const left=[];
  if(p.km)left.push(p.km-usedKm>0?fmtKm(p.km-usedKm)+" kaldı":fmtKm(usedKm-p.km)+" geçti");
  if(p.yr){const dl=Math.round(p.yr*365-days);left.push(dl>0?(dl>60?Math.round(dl/30)+" ay":dl+" gün")+" kaldı":"süresi doldu")}
  return {last,pct,cls:pct>=1?"bad":pct>=.85?"warn":"",text:left.join(" · ")||"Ömür girilmedi"};
}

/* --- Yakıt --- */
function fuelStats(v){
  const L=(v.fuelLogs||[]).slice().sort((a,b)=>a.km-b.km||a.date.localeCompare(b.date));
  const per={};let prev=-1,acc=0,accC=0,totL=0,totC=0,span=0;
  L.forEach((f,i)=>{
    if(prev>=0){acc+=Number(f.liters)||0;accC+=Number(f.cost)||0}
    if(f.full){if(prev>=0){const dk=f.km-L[prev].km;if(dk>0){per[f.id]=acc/dk*100;totL+=acc;totC+=accC;span+=dk}}prev=i;acc=0;accC=0}
  });
  const lastF=[...L].reverse().find(f=>per[f.id]!=null),ym=today().slice(0,7);
  return {L,per,avg:span>0?totL/span*100:null,perKm:span>0?totC/span:null,last:lastF?per[lastF.id]:null,
    month:L.filter(f=>f.date.startsWith(ym)).reduce((s,f)=>s+(Number(f.cost)||0),0),
    totalL:L.reduce((s,f)=>s+(Number(f.liters)||0),0)};
}

let expYear=null;

  const months=Array(12).fill(0);yr.forEach(c=>months[Number(c.date.slice(5,7))-1]+=c.amount);
  const max=Math.max(...months),topI=max>0?months.indexOf(max):-1;

/* ===== Service book PDF ===== */
function buildPdf(imgs,w,h){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=d=>{const b=typeof d==="string"?enc.encode(d):d;parts.push(b);len+=b.length};
  const obj=(id,body)=>{offs[id]=len;push(`${id} 0 obj\n`);body();push("\nendobj\n")};
  const PW=595.28,PH=841.89,n=imgs.length;
  push(new Uint8Array([0x25,0x50,0x44,0x46,0x2d,0x31,0x2e,0x34,0x0a,0x25,0xe2,0xe3,0xcf,0xd3,0x0a]));
  obj(1,()=>push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2,()=>push(`<< /Type /Pages /Kids [${imgs.map((_,i)=>`${3+3*i} 0 R`).join(" ")}] /Count ${n} >>`));
  imgs.forEach((im,i)=>{const p=3+3*i,cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im${i} Do Q`;
    obj(p,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im${i} ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
    obj(p+1,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(p+2,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.length} >>\nstream\n`);push(im);push("\nendstream")});
  });
  const total=3+3*n,xref=len;
  let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let k=1;k<total;k++)x+=String(offs[k]).padStart(10,"0")+" 00000 n \n";
  push(x);push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out=new Uint8Array(len);let o=0;parts.forEach(b=>{out.set(b,o);o+=b.length});return out;
}

/* --- Auto technical data from the internet (CarQuery open vehicle database) --- */
const SPEC_FIELDS=[
  ["motor_hacmi_cc","Motor hacmi",x=>x+" cc"],["guc_hp","Güç",x=>x+" PS"],["tork_nm","Tork",x=>x+" Nm"],
  ["silindir","Silindir"],["yakit","Yakıt"],["vites","Şanzıman"],["ceker","Çekiş"],["kasa","Kasa tipi"],
  ["yakit_deposu_l","Yakıt deposu",x=>x+" L"],["ortalama_tuketim","Ortalama tüketim",x=>x+" L/100 km"],
  ["maks_hiz","Maksimum hız",x=>x+" km/s"],["hizlanma","0-100 km/s",x=>x+" sn"],["agirlik","Ağırlık",x=>x+" kg"]
];
let specJob=null;
const CQ="https://www.carqueryapi.com/api/0.3/";
const MAKE_ALIAS={"Citroën":"citroen","KGM (SsangYong)":"ssangyong","DS Automobiles":"ds","MINI":"mini","Mercedes-Benz":"mercedes-benz","Land Rover":"land-rover","Alfa Romeo":"alfa-romeo","Aston Martin":"aston-martin","Rolls-Royce":"rolls-royce"};
const MODEL_ALIAS={"Egea Sedan":"Tipo","Egea Hatchback":"Tipo","Egea Cross":"Tipo","Egea Station Wagon":"Tipo","Accent Blue":"Accent","Accent Era":"Accent","Symbol":"Thalia","Clio Symbol":"Thalia","Courier":"Transit Courier","Astra Classic":"Astra","Megane Sedan":"Megane","Şahin":"131","Doğan":"131","Kartal":"131","Murat 131":"131","Murat 124":"124"};
function cqMake(b){return MAKE_ALIAS[b]||b.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i").replace(/\s+/g,"-")}
function cqModels(m){
  const out=[];const add=x=>{if(x&&!out.includes(x))out.push(x)};
  add(MODEL_ALIAS[m]);
  let r=m.match(/^(\d) Serisi/);if(r)add(r[1]+" Series");
  r=m.match(/^([A-Z]) Serisi/);if(r)add(r[1]+"-Class");
  add(m);add(m.split(" ")[0]);
  return out;
}
function jsonp(url){
  return new Promise((res,rej)=>{
    const cb="cq"+Date.now()+Math.floor(Math.random()*1e5),s=document.createElement("script");
    const done=()=>{clearTimeout(t);try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()};
    const t=setTimeout(()=>{done();rej(new Error("timeout"))},15000);
    window[cb]=d=>{done();res(d)};
    s.onerror=()=>{done();rej(new Error("network"))};
    s.src=url+"&callback="+cb;document.head.appendChild(s);
  });
}
const num=x=>{const n=parseFloat(x);return isFinite(n)&&n>0?n:null};
function trFuel(f){f=String(f||"").toLowerCase();if(!f)return null;if(f.includes("diesel"))return "Dizel";if(f.includes("electric"))return "Elektrik";if(f.includes("hybrid"))return "Hibrit";if(f.includes("lpg")||f.includes("gas"))return "Benzin / LPG";return "Benzin"}
function trGear(g){g=String(g||"").toLowerCase();if(!g)return null;if(g.includes("auto")||g.includes("cvt")||g.includes("dct"))return "Otomatik";return "Manuel"}
function trDrive(d){d=String(d||"").toLowerCase();if(!d)return null;if(d.includes("front"))return "Önden çekiş";if(d.includes("rear"))return "Arkadan itiş";if(d.includes("all")||d.includes("4")||d.includes("four"))return "4x4 / AWD";return d}
function normTrim(t){
  const cc=num(t.model_engine_cc),ps=num(t.model_engine_power_ps)||(num(t.model_engine_power_hp)?Math.round(num(t.model_engine_power_hp)*1.014):null);
  const lkm=num(t.model_lkm_mixed)||num(t.model_lkm_city);
  const ad=[cc?(cc/1000).toFixed(1):null,t.model_trim||null,ps?ps+" PS":null,trGear(t.model_transmission_type)].filter(Boolean).join(" ");
  return {ad:ad||t.model_name,yil:t.model_year,motor_hacmi_cc:cc?Math.round(cc):null,guc_hp:ps?Math.round(ps):null,tork_nm:num(t.model_engine_torque_nm)?Math.round(num(t.model_engine_torque_nm)):null,
    silindir:num(t.model_engine_cyl),yakit:trFuel(t.model_engine_fuel),vites:trGear(t.model_transmission_type),ceker:trDrive(t.model_drive),kasa:t.model_body||null,
    yakit_deposu_l:num(t.model_fuel_cap_l),ortalama_tuketim:lkm?lkm.toFixed(1).replace(".",","):null,maks_hiz:num(t.model_top_speed_kph),hizlanma:num(t.model_0_to_100_kph),agirlik:num(t.model_weight_kg)};
}
async function lookupTrims(v){
  const make=encodeURIComponent(cqMake(v.brand));
  for(const m of cqModels(v.model)){
    const mm=encodeURIComponent(m);
    let d=await jsonp(`${CQ}?cmd=getTrims&make=${make}&model=${mm}&year=${v.year}`);
    let trims=(d&&d.Trims)||[];let note=null;
    if(!trims.length){
      d=await jsonp(`${CQ}?cmd=getTrims&make=${make}&model=${mm}`);
      trims=(d&&d.Trims)||[];
      if(trims.length){
        const years=[...new Set(trims.map(t=>Number(t.model_year)))];
        const best=years.sort((a,b)=>Math.abs(a-v.year)-Math.abs(b-v.year))[0];
        trims=trims.filter(t=>Number(t.model_year)===best);
        note=`${v.year} için kayıt yok, en yakın yıl olan ${best} verileri gösteriliyor.`;
      }
    }
    if(trims.length){
      if(m!==v.model)note=[`Veritabanında "${m}" adıyla bulundu.`,note].filter(Boolean).join(" ");
      const seen=new Set(),list=[];
      trims.map(normTrim).forEach(x=>{const k=[x.motor_hacmi_cc,x.guc_hp,x.yakit,x.vites].join("|");if(!seen.has(k)){seen.add(k);list.push(x)}});
      return {list:list.slice(0,12),note};
    }
  }
  return {list:[],note:null};
}

function specsHTML(v){
  const head=(btn)=>`<div class="section-h"><h3>Fabrika verileri</h3>${btn||""}</div>`;
  if(specJob&&specJob.id===v.id)return head()+
    `<div class="specbox loading"><div class="spin"></div><div><b>${esc(v.brand)} ${esc(v.model)} ${v.year}</b> için motor seçenekleri internetten getiriliyor…</div></div>`;
  if(v.specError)return head()+`<div class="specbox"><div>${esc(v.specError)}</div><button class="btn btn-ghost" id="specRetry">Tekrar dene</button></div>`;
  if(!v.variants||!v.variants.length)return head()+`<div class="specbox"><div>Motor hacmi, güç, tork, depo ve tüketim gibi bilgileri internetten otomatik doldurabilirim.</div><button class="btn btn-ghost" id="specRetry">Teknik bilgileri getir</button></div>`;
  const cur=v.variants[v.spec||0]||v.variants[0];
  const rows=SPEC_FIELDS.filter(([k])=>cur[k]!=null&&cur[k]!=="").map(([k,l,f])=>`<div class="spec"><span class="label">${l}</span><span class="v num">${esc(f?f(cur[k]):cur[k])}</span></div>`);
  if(rows.length%2)rows.push(`<div class="spec"></div>`);
  return head(`<button class="link-btn" id="specRefresh">Yenile</button>`)+
    `<div class="field"><label class="label" for="specPick">Motor seçeneği</label>
      <select id="specPick">${v.variants.map((x,i)=>`<option value="${i}" ${i===(v.spec||0)?"selected":""}>${esc(x.ad||("Seçenek "+(i+1)))}</option>`).join("")}</select></div>
    ${rows.length?`<div class="specs">${rows.join("")}</div>`:`<div class="specbox">Bu seçenek için ayrıntılı değer yok.</div>`}
    ${v.specNote?`<div class="hint">${esc(v.specNote)}</div>`:""}
    <div class="hint">Kaynak: CarQuery açık araç veritabanı${v.specDate?", "+fmtDate(v.specDate):""}. Yağ, triger ve lastik bilgilerini Aracım bölümünden Düzenle ile girebilirsin.</div>`;
}
function wireSpecs(v){
  const r=$("#specRetry");if(r)r.onclick=()=>fetchSpecs(v,true);
  const rf=$("#specRefresh");if(rf)armButton(rf,"Yeniden getir?",()=>fetchSpecs(v,true));
  const p=$("#specPick");if(p)p.onchange=()=>{v.spec=Number(p.value);applyVariant(v);save();renderDetail();toast("Motor seçeneği güncellendi")};
}
function applyVariant(v){
  const x=v.variants[v.spec||0];if(!x)return;
  if(x.ad)v.engine=x.ad;
  if(x.yakit)v.fuel=x.yakit==="Benzin / LPG"?"LPG + Benzin":x.yakit;
  if(x.vites)v.gear=x.vites;
}
async function fetchSpecs(v,byUser){
  specJob={id:v.id};v.specError=null;v.specTried=true;
  if(curId===v.id)renderDetail();
  try{
    const {list,note}=await lookupTrims(v);
    if(!list.length)v.specError=`${v.brand} ${v.model} internetteki veritabanında bulunamadı. Bilgileri Aracım bölümünden Düzenle ile girebilirsin.`;
    else{v.variants=list;v.spec=0;v.specNote=note;v.specDate=today();applyVariant(v);if(byUser)toast("Teknik bilgiler güncellendi")}
  }catch(e){
    v.specError=navigator.onLine===false?"İnternet bağlantısı yok. Bağlanınca tekrar dene.":"Veri kaynağına ulaşılamadı. Biraz sonra tekrar dene.";
  }finally{specJob=null;save();if(curId===v.id&&!$("#detail").hidden)renderDetail();}
}

function armButton(btn,armedText,action){
  const orig=btn.textContent;

    btn.classList.add("armed");btn.textContent=armedText;
    setTimeout(()=>{if(btn.isConnected){btn.classList.remove("armed");btn.textContent=orig}},3500);
  };
}

      <div class="field"><label class="label" for="tTire">${moto?"Lastik (ön / arka)":"Lastik ölçüsü"}</label><input id="tTire" value="${esc(v.tire)}" placeholder="${moto?"110/70-13 / 130/70-13":"205/55 R16"}" maxlength="20"></div>
      <div class="field"><label class="label" for="tBat">Akü</label><input id="tBat" value="${esc(v.battery)}" placeholder="12V 60Ah" maxlength="20"></div>
    </div>
    <div class="sheet-actions"><button class="btn btn-ghost" data-close>Vazgeç</button><button class="btn btn-primary" id="tSave">Kaydet</button></div>`);
  $("#tPlate").addEventListener("input",e=>e.target.value=normPlate(e.target.value));
  $("#tSave").onclick=()=>{
    v.km=$("#tKm").value?Number($("#tKm").value):"";
    const iv=$("#tInt").value;v.interval=iv?Number(iv.replace(/\D/g,"")):(moto?5000:10000);
    if(moto){v.power=$("#tPow").value;v.cooling=$("#tCool").value}
    v.fuel=$("#tFuel").value;v.gear=$("#tGear").value;v.engine=$("#tEng").value.trim();v.color=$("#tCol").value.trim();
    if($("#tPlate").value.trim().length>=5)v.plate=$("#tPlate").value.trim();
    if($("#tYear").value)v.year=Number($("#tYear").value);
    v.oil=$("#tOil").value.trim();v.oilCap=$("#tOilCap").value.trim();v.timing=$("#tTim").value;
    v.timingKm=$("#tTimKm").value?Number($("#tTimKm").value):"";v.tire=$("#tTire").value.trim();v.battery=$("#tBat").value.trim();
    save();closeSheet();renderDetail();toast("Teknik bilgiler kaydedildi");
  };
}

/* Boot */
$("#plateOcr").onclick=async()=>{const r=await ocrPlate();if(r){const i=$("#fPlate");i.value=normPlate(r);i.dispatchEvent(new Event("input"));toast("Plaka okundu, kontrol et")}};
(async()=>{
  fillSelects();
  await initFiles();
  await loadState();
  if(S.owner&&S.vehicles.length){renderHome();show("home")}
  else if(S.owner){openOnb(true);$("#cancelAdd").hidden=true}
  else openOnb(false);
  if(S.vehicles.length)scheduleAll();
})();
})();
</script>

</body>
</html>
